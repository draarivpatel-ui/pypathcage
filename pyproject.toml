[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pypathcage"
version = "1.0.0"
description = "Zero-dependency path traversal, zip-slip, tar-slip and decompression-bomb protection for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pypathcage contributors" }]
keywords = ["security", "path-traversal", "zip-slip", "tar-slip", "decompression-bomb", "cve-2007-4559"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/pypathcage/pypathcage"
Issues = "https://github.com/pypathcage/pypathcage/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypathcage = ["py.typed"]
